<text x="77.0" y="818.2" font-size="9.9" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.36em">Every pin is 3.3 V logic, so no level shifting is needed: the hook-up ten64 used.</text>
<circle cx="61.6" cy="839.1" r="3.3" fill="#1a1a2e"/>
<text x="77.0" y="839.1" font-size="9.9" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.36em">RXD is the board's input and TXD its output: GPIO4 (TX) goes to RXD, GPIO3 (RX) to TXD.</text>
<circle cx="61.6" cy="860.0" r="3.3" fill="#1a1a2e"/>
<text x="77.0" y="860.0" font-size="9.9" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.36em">Default UART speed is 9600 baud. Takes RTCM 2.3 corrections only.</text>
