<circle cx="61.6" cy="804.4" r="3.3" fill="#1a1a2e"/>
<text x="77.0" y="804.4" font-size="9.9" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.36em">RXD is the board's input and TXD its output: GPIO4 (TX) goes to RXD, GPIO3 (RX) to TXD.</text>
<circle cx="61.6" cy="825.3" r="3.3" fill="#1a1a2e"/>
<text x="77.0" y="825.3" font-size="9.9" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.36em">Default UART speed is 9600 baud. Takes RTCM 2.3 corrections only.</text>
