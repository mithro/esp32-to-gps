<circle cx="61.6" cy="718.5" r="3.3" fill="#1a1a2e"/>
<text x="77.0" y="718.5" font-size="9.9" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.36em">TX is the module's output and RX its input. If the module is silent, check these two first.</text>
<circle cx="61.6" cy="739.4" r="3.3" fill="#1a1a2e"/>
<text x="77.0" y="739.4" font-size="9.9" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.36em">Default UART speed is 38400 baud. The module has no flash, so the firmware configures it at every boot.</text>
</svg>
