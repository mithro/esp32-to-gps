; esp32-to-gps build env: ESP32-C3 SuperMini + GPS receiver.
; Copied to the root of the mithro/Tasmota checkout by firmware/build.py.
;
; The env extends env:tasmota32c3, whose board (esp32c3) keeps the native
; USB-Serial-JTAG console. Do not switch to tasmota32c3ser / esp32c3ser: a node
; without its USB console cannot be recovered once it goes dark (this is what
; esp32-to-433mhz learned). user_config_override.h fails the build if that
; regresses.
[platformio]
default_envs            = tasmota32c3-gps

[env:tasmota32c3-gps]
extends                 = env:tasmota32c3
build_flags             = ${env:tasmota32c3.build_flags}
                          -DUSE_CONFIG_OVERRIDE
                          -DCODE_IMAGE_STR='"gps"'
                          ; No IPv6. On ansells-iot the nodes never get a global address
                          ; (the network offers stateful DHCPv6 only, which lwIP lacks), but
                          ; the router advertisements' RDNSS overwrote the DHCPv4 DNS server
                          ; in lwIP's one DNS table; Tasmota could only put it back if it had
                          ; seen it first, and on about half of boots it had not, leaving the
                          ; node with no DNS and no MQTT (rpiz-gps, 2026-10-08).
                          -UUSE_IPV6
