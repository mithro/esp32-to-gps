name: Firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host tests of the GNSS core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Fetch the pinned mithro/Tasmota fork
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run firmware/build.py --fetch-only

      - name: Run the tests (the core compiled with -Werror, against real captures)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --with pytest --with cffi --with pyubx2 --with pynmeagps --with pyrtcm --with jinja2 \
            pytest firmware/tests -v

  build:
    name: Build tasmota32c3-gps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/build.py') }}

      - name: Build (clones the pinned fork, runs pioarduino)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run firmware/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: tasmota32c3-gps
          path: |
            firmware/dist/*.bin
            firmware/dist/*.elf
            firmware/dist/*.map
            firmware/dist/build-info-*.json
